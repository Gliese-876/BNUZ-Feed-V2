name: Deploy BNUZ Feed V2 to GitHub Pages

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # Beijing time 06:00-07:45 => UTC 22:00-23:45 (previous day)
    - cron: "0,15,30,45 22-23 * * *"
    # Beijing time 08:00-21:45 => UTC 00:00-13:45
    - cron: "0,15,30,45 0-13 * * *"
    # Beijing time final run at 22:00 => UTC 14:00
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Refresh all source data before publishing
        type: boolean
        default: true
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  REFRESH_DATA: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data) }}

concurrency:
  group: pages-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source registry
        run: |
          npm run licenses:check
          npm run check
          npm test -- --maxWorkers=2

  build:
    needs: validate
    if: ${{ !cancelled() && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      contents: read
      pages: read
    env:
      BNUZ_FEED_SNAPSHOT_NODE_MAX_ATTEMPTS: 3
      BNUZ_FEED_SNAPSHOT_BROWSER_MAX_ATTEMPTS: 2
      BNUZ_FEED_SNAPSHOT_ROUND_LIMIT: 2
      BNUZ_FEED_SNAPSHOT_RETRY_DELAY_MS: 2000
      BNUZ_FEED_SNAPSHOT_TIMEOUT_MS: 10000
      BNUZ_FEED_SNAPSHOT_BROWSER_TIMEOUT_MS: 15000
      BNUZ_FEED_SNAPSHOT_BROWSER_HOSTS: www.bnuzh.edu.cn,zhb.bnu.edu.cn
      BNUZ_FEED_SNAPSHOT_BROWSER_CHANNEL: chrome
      BNUZ_FEED_SNAPSHOT_CONCURRENCY: 3
      BNUZ_FEED_SNAPSHOT_TARGET_CONCURRENCY: 2
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Install dependencies
        run: npm ci

      - name: Select latest healthy snapshot
        env:
          BNUZ_FEED_PUBLISHED_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run snapshot:publish

      - name: Verify system Chrome
        if: env.REFRESH_DATA == 'true'
        timeout-minutes: 1
        run: google-chrome --version

      - name: Generate snapshot data
        if: env.REFRESH_DATA == 'true'
        timeout-minutes: 10
        env:
          BNUZ_FEED_SNAPSHOT_PUBLIC_ONLY: 'true'
        run: npm run snapshot 2>&1 | tee snapshot.log

      - name: Verify snapshot health
        run: node scripts/check-snapshot-health.cjs

      - name: Preserve refresh diagnostics
        if: failure() && env.REFRESH_DATA == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: snapshot-diagnostics-${{ github.run_id }}
          path: snapshot.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Build web app
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/web/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check that this is still the latest commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A newer commit is available; skip this outdated deployment."
          fi

      - name: Deploy to GitHub Pages
        if: steps.latest.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v5.0.1
