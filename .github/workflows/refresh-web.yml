name: Deploy BNUZ Feed V2 to GitHub Pages

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # Beijing time 06:00-07:45 => UTC 22:00-23:45 (previous day)
    - cron: "0,15,30,45 22-23 * * *"
    # Beijing time 08:00-21:45 => UTC 00:00-13:45
    - cron: "0,15,30,45 0-13 * * *"
    # Beijing time final run at 22:00 => UTC 14:00
    - cron: "0 14 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-refresh-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source registry
        run: |
          npm run check
          npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BNUZ_FEED_SNAPSHOT_NODE_MAX_ATTEMPTS: 10
      BNUZ_FEED_SNAPSHOT_BROWSER_MAX_ATTEMPTS: 5
      BNUZ_FEED_SNAPSHOT_ROUND_LIMIT: 2
      BNUZ_FEED_SNAPSHOT_RETRY_DELAY_MS: 5000
      BNUZ_FEED_SNAPSHOT_TIMEOUT_MS: 5000
      BNUZ_FEED_SNAPSHOT_BROWSER_TIMEOUT_MS: 5000
      BNUZ_FEED_SNAPSHOT_BROWSER_HOSTS: www.bnuzh.edu.cn
      BNUZ_FEED_SNAPSHOT_CONCURRENCY: 3
      BNUZ_FEED_SNAPSHOT_TARGET_CONCURRENCY: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Resolve Vite base path
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          if [ "$repo_name" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/${repo_name}/" >> "$GITHUB_ENV"
          fi

      - name: Configure Playwright download mirror
        if: vars.PLAYWRIGHT_DOWNLOAD_HOST != ''
        run: echo "PLAYWRIGHT_DOWNLOAD_HOST=${{ vars.PLAYWRIGHT_DOWNLOAD_HOST }}" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Generate snapshot data
        timeout-minutes: 15
        run: npm run snapshot

      - name: Verify snapshot health
        run: node scripts/check-snapshot-health.cjs

      - name: Build web app
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    needs:
      - validate
      - build
    if: always() && needs.build.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
